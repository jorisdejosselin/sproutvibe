[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "sprout-mcp"
version = "0.1.0"
description = "MCP server for the Sprout plant care app"
requires-python = ">=3.11,<3.15"
dependencies = [
    "mcp[cli]==2.3.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[project.scripts]
sprout-mcp = "sprout_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["sprout_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
