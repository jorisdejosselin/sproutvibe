repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        files: ^backend/

  - repo: local
    hooks:
      - id: frontend-lint
        name: ESLint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        types: [file]
        files: \.(js|jsx)$
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: bash -c 'cd backend && .venv/bin/pytest tests/ -q --tb=short'
        language: system
        pass_filenames: false
        always_run: true

      - id: commitlint
        name: commitlint
        stages: [commit-msg]
        language: system
        entry: npx --no -- commitlint --edit
        pass_filenames: false
