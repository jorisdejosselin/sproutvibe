name: Release

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Backstop for releases that nothing asked for.
      #
      # renovate.json tags CI-only bumps `ci(deps)`, which release.config.mjs
      # refuses to release. That works -- but only for branches Renovate
      # creates *after* the rule exists. Renovate writes a branch's commit
      # message once and will not rewrite it while the packaged files are
      # unchanged ("No package files need updating"), so a branch opened
      # before the rule landed keeps its old `chore(deps)` subject forever and
      # still cuts a release for a workflow-only diff. PR #66 was exactly that:
      # it had to be squash-merged under a hand-written subject to stay quiet.
      # This step removes the need for that by-hand step next time.
      #
      # So don't trust the subject line. Look at the diff: if the push touches
      # nothing a user can run, there is nothing to version, tag, build an
      # image for or ship an APK of. Skipping loses nothing -- semantic-release
      # analyses every commit since the last tag, so these commits still show
      # up in the notes of the next real release.
      #
      # Fails open on purpose: if the diff can't be determined, release.
      - name: Does this push change anything that ships?
        id: shipped
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Previous commit unavailable -- assuming this push ships something."
            echo 'shipped=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BEFORE" "$AFTER" > "$RUNNER_TEMP/changed.txt"
          echo "Changed files:"
          sed 's/^/  /' "$RUNNER_TEMP/changed.txt"
          # Dev tooling, CI config and docs. Anything NOT listed here ships:
          # a new product directory releases by default rather than being
          # silently skipped. Paths are anchored, so backend/pyproject.toml
          # and frontend/package.json still count as shipped -- only the
          # repo-root copies (bandit config, commitlint) are dev-only.
          grep -vE '^(\.github/|docs/|scripts/|\.gitignore$|\.pre-commit-config\.yaml$|ruff\.toml$|renovate\.json$|release\.config\.mjs$|commitlint\.config\.mjs$|package\.json$|package-lock\.json$|pyproject\.toml$|skaffold\.yaml$|skaffold\.env\.example$|uv\.lock$|LICENSE$|.*\.md$)' \
            "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/ships.txt" || true
          if [ -s "$RUNNER_TEMP/ships.txt" ]; then
            echo "Ships -- a release is warranted:"
            sed 's/^/  /' "$RUNNER_TEMP/ships.txt"
            echo 'shipped=true' >> "$GITHUB_OUTPUT"
          else
            echo "Only CI/dev/docs scaffolding changed -- skipping the release."
            echo 'shipped=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Run semantic-release
        id: semantic
        if: steps.shipped.outputs.shipped == 'true'
        uses: cycjimmy/semantic-release-action@v8.1.4
        with:
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sprout-backend
          tags: |
            type=semver,pattern=v{{version}},value=v${{ needs.release.outputs.new_release_version }}
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          annotations: ${{ steps.meta-backend.outputs.annotations }}
          build-args: |
            APP_VERSION=${{ needs.release.outputs.new_release_version }}

      - name: Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sprout-frontend
          tags: |
            type=semver,pattern=v{{version}},value=v${{ needs.release.outputs.new_release_version }}
            type=raw,value=latest

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          annotations: ${{ steps.meta-frontend.outputs.annotations }}

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Generate Android icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v6
        with:
          java-version: "25.0.5+8.0.LTS"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: frontend/android

      - name: Sign and upload APK
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "KEYSTORE_BASE64 not configured — skipping signing"
            exit 0
          fi
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
          UNSIGNED=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$STORE_PASSWORD" \
            --out "sprout-v${{ needs.release.outputs.new_release_version }}.apk" \
            "$UNSIGNED"
          gh release upload \
            "v${{ needs.release.outputs.new_release_version }}" \
            "sprout-v${{ needs.release.outputs.new_release_version }}.apk"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
