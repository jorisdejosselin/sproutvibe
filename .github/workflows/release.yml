name: Release

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v5
        with:
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sprout-backend
          tags: |
            type=semver,pattern=v{{version}},value=v${{ needs.release.outputs.new_release_version }}
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          annotations: ${{ steps.meta-backend.outputs.annotations }}
          build-args: |
            APP_VERSION=${{ needs.release.outputs.new_release_version }}

      - name: Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sprout-frontend
          tags: |
            type=semver,pattern=v{{version}},value=v${{ needs.release.outputs.new_release_version }}
            type=raw,value=latest

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          annotations: ${{ steps.meta-frontend.outputs.annotations }}

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Generate Android icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: frontend/android

      - name: Sign and upload APK
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "KEYSTORE_BASE64 not configured — skipping signing"
            exit 0
          fi
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
          UNSIGNED=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$STORE_PASSWORD" \
            --out "sprout-v${{ needs.release.outputs.new_release_version }}.apk" \
            "$UNSIGNED"
          gh release upload \
            "v${{ needs.release.outputs.new_release_version }}" \
            "sprout-v${{ needs.release.outputs.new_release_version }}.apk"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
