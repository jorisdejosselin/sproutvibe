[tool.poetry]
name = "sprout-backend"
version = "0.1.0"
description = "Sprout plant care app — FastAPI backend"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12"
fastapi = "0.135.2"
pydantic-settings = "2.13.1"
uvicorn = { version = "0.42.0", extras = ["standard"] }
sqlalchemy = "2.0.48"
alembic = "1.18.4"
python-jose = { version = "3.5.0", extras = ["cryptography"] }
bcrypt = "5.0.0"
python-multipart = "0.0.22"
python-dotenv = "1.2.2"
email-validator = "2.3.0"
aiofiles = "25.1.0"
httpx = "0.28.1"
pyyaml = "6.0.3"
pywebpush = "2.3.0"
apscheduler = "3.11.2"
psycopg2-binary = "2.9.11"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.2"
pytest-asyncio = "1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
